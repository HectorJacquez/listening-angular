name: CI

# Runs on GitHub and on a self-hosted Forgejo (its runner speaks the same
# workflow syntax). Lint is the compiler: TypeScript strict + Angular templates.
on:
  push:
  pull_request:

jobs:
  test:
    name: format · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting (Prettier)
        run: pnpm run format:check
      - name: Run tests (Vitest)
        run: pnpm exec ng test --watch=false --reporters=verbose
      - name: Build
        run: pnpm exec ng build --base-href /listening-angular/
      - name: Upload the site for Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main' && github.server_url == 'https://github.com'
        with:
          path: dist/listening-angular/browser

  deploy:
    name: deploy to GitHub Pages
    # GitHub Pages only; Forgejo skips this job because the artifact step did not run there.
    if: github.ref == 'refs/heads/main' && github.server_url == 'https://github.com'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
